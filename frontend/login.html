<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="login">
    <form id="login" class="box">
      <input id="username" class="field" type="text" placeholder="Login" autocomplete="username" required>
      <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <p id="status"></p>
    </form>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>

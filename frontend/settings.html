<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">
    <main class="main">
      <nav class="nav">
        <span class="nav-main"><a href="/">Home</a> | <span class="inactive">About</span> | <a href="/blog">Blog</a></span>
        <span id="admin-nav" class="nav-admin" hidden><a href="/posts">Posts</a> | <a href="/new">New</a></span>
      </nav>
      <div class="box">
        <h2>Share new posts by default</h2>
        <div id="networks"></div>
        <h2>Default post type</h2>
        <p>
          <label><input type="radio" name="default-type" value="short"> Short</label>
          <label><input type="radio" name="default-type" value="article"> Article</label>
        </p>
        <h2>GitHub username</h2>
        <input id="github-user" class="field" type="text" maxlength="39">
        <h2>Hashtag sets</h2>
        <div id="hashtags"></div>
        <p><button id="add-set" type="button">Add set</button></p>
        <button id="save" type="button">Save</button>
        <p id="status"></p>
      </div>
    </main>
  </div>
  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/settings.js"></script>
</body>
</html>
